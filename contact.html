<body id="top">

    
<header>
    <button
        id="menu-toggle"
        type="button"
        aria-label="Deschide meniul"
        aria-expanded="false"
        aria-controls="main-nav"
    >
        ☰
    </button>

    <a href="index.html" class="logo">M.D.</a>

    <nav id="main-nav">
        <a href="index.html">Acasă</a>
        <a href="about.html">Despre mine</a>

        <a href="contact.html">Contact</a>

    <main>
        <section>
            <h1>Contact</h1>
            <p>
                Ai o întrebare sau vrei să discutăm despre un proiect?
                Îmi poți lăsa un mesaj folosind formularul de mai jos.
            </p>
        </section>

        <section>
            <form id="contact-form">
                <label for="name">Numele tău</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >

                <label for="email">Adresa de email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

                <label for="message">Mesajul tău</label>
                <textarea
                    id="message"
                    name="message"
                    rows="5"
                    required
                ></textarea>

                <button type="submit">Trimite mesajul</button>
            </form>

            <p id="form-status" aria-live="polite"></p>
        </section>
    </main>

    <footer>
        <p>M.D.</p>
        <small>Portofoliu personal · Est. 2026</small>
        <a href="#top">Înapoi sus ↑</a>
